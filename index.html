/* 現場の掲示板：紺のヘッダー＋白い紙面、締切は朱、角は立てる */
:root{
  --bg:#eef1f3; --paper:#ffffff; --ink:#17212b; --mute:#5f6b78; --line:#d5dbe1;
  --accent:#14526e; --accent-soft:#e1edf2; --due:#c2410c; --due-soft:#fbe9e0; --ok:#2f7d4f; --ok-soft:#e3f1e8; --do:#6b4fa3; --do-soft:#ece7f5;
  --head:#14324a; --head-ink:#ffffff;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --paper:#17212b; --ink:#e6ebf0; --mute:#9aa6b2; --line:#2a3743;
  --accent:#6fb3d2; --accent-soft:#1b3442; --due:#f08a5d; --due-soft:#3a2219; --ok:#6cc08f; --ok-soft:#1a3426; --do:#b39ae6; --do-soft:#2a2340;
  --head:#0b2233; --head-ink:#e6ebf0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f161d; --paper:#17212b; --ink:#e6ebf0; --mute:#9aa6b2; --line:#2a3743;
  --accent:#6fb3d2; --accent-soft:#1b3442; --due:#f08a5d; --due-soft:#3a2219; --ok:#6cc08f; --ok-soft:#1a3426; --do:#b39ae6; --do-soft:#2a2340;
  --head:#0b2233; --head-ink:#e6ebf0; color-scheme:dark;}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header.top{background:var(--head);color:var(--head-ink)}
header.top .in{max-width:780px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;letter-spacing:.04em}
header.top .date{font-size:13px;opacity:.85}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:780px}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:700;border-top:3px solid transparent}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .n{font-family:var(--f-body);font-size:12px;color:var(--mute);font-weight:400}
.card{background:var(--paper);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--mute)}
a.row{color:inherit;text-decoration:none}
a.row:hover{background:var(--accent-soft)}
.chev{width:16px;height:16px;color:var(--mute);flex:none}
.stripe{width:4px;align-self:stretch;flex:none;background:var(--accent)}
.k-deadline .stripe{background:var(--due)} .k-do .stripe{background:var(--do)} .k-span .stripe{background:var(--accent)}
.chk{width:26px;height:26px;flex:none;border:2px solid var(--mute);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.chk svg{width:16px;height:16px;opacity:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk[aria-pressed="true"] svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--mute)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.p-進行中{color:var(--accent)} .p-完了{color:var(--ok)} .p-保留{color:var(--mute)} .p-未着手{color:var(--due)}
.when{font-size:12px;font-weight:700;white-space:nowrap;color:var(--mute);text-align:right;min-width:54px}
.when.late{color:var(--due)} .when.today{color:var(--accent)}
.empty{padding:14px 12px;color:var(--mute);font-size:13.5px}
.meter{height:8px;background:var(--line);margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi div{background:var(--paper);padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.2}
.kpi span{font-size:12px;color:var(--mute)}
.kpi .late b{color:var(--due)}
/* detail */
.back{display:inline-flex;align-items:center;gap:4px;margin-top:14px;color:var(--accent);text-decoration:none;font-weight:700;font-size:14px}
.dhead{margin:10px 0 0}
.dhead .cat{font-size:12px;color:var(--mute)}
.dhead h2{font-size:22px;margin:2px 0 10px}
dl.facts{display:grid;grid-template-columns:7.5em 1fr;margin:0;background:var(--paper);border:1px solid var(--line)}
dl.facts dt,dl.facts dd{margin:0;padding:8px 12px;border-top:1px solid var(--line)}
dl.facts dt{color:var(--mute);font-size:13px;background:var(--bg)}
dl.facts dt:first-of-type,dl.facts dd:first-of-type{border-top:0}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 4px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--paper);padding:8px 10px}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.memo{padding:10px 12px;border-top:1px solid var(--line)}
.memo:first-child{border-top:0}
.memo .d{font-size:12px;color:var(--mute);font-weight:700}
.memo .x{font-size:12px;color:var(--mute);background:none;border:0;cursor:pointer;float:right;padding:0 2px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr}}
table.trk{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font-size:13.5px}
table.trk th,table.trk td{padding:6px 8px;border-top:1px solid var(--line);text-align:right}
table.trk th:first-child,table.trk td:first-child{text-align:left}
table.trk thead th{background:var(--bg);font-size:12px;color:var(--mute);border-top:0}
table.trk input{width:4.5em;text-align:right;padding:4px 6px}
table.trk tr.cur td{background:var(--accent-soft)}
/* calendar */
.calbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.calbar h2{margin:0;font-size:18px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cal .wd{background:var(--bg);font-size:11.5px;text-align:center;padding:4px 0;color:var(--mute);font-weight:700}
.cal .wd.sun,.cal .day.sun .num,.cal .day.hol .num{color:var(--due)}
.cal .wd.sat,.cal .day.sat .num{color:var(--accent)}
.cal .day{background:var(--paper);min-height:76px;padding:3px 3px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;border:0;text-align:left;min-width:0}
.cal .day.out{background:var(--bg);opacity:.55}
.cal .day .num{font-size:12px;font-weight:700;line-height:1.2}
.cal .day.is-today .num{background:var(--accent);color:#fff;padding:0 4px;align-self:flex-start}
.cal .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .ev{font-size:10px;line-height:1.35;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cal .ev.k-deadline{background:var(--due-soft);color:var(--due)}
.cal .ev.k-span{background:var(--accent-soft);color:var(--accent)}
.cal .ev.k-do{background:var(--do-soft);color:var(--do)}
.cal .ev.isdone{opacity:.45;text-decoration:line-through}
.cal .more{font-size:10px;color:var(--mute)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
/* notify */
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;padding:10px 12px 10px 44px;border-top:1px solid var(--line);position:relative}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.note{font-size:13px;color:var(--mute);margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;font-size:13px;font-weight:700;z-index:20;display:none}
.toast.on{display:block}
.ro{background:var(--due-soft);color:var(--due);font-size:13px;padding:8px 12px;margin-top:12px;display:none}
.ro.on{display:block}
@media (prefers-reduced-motion:no-preference){a.row,.btn{transition:background .12s}}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function statusOf(id){return state.status[id]!==undefined?state.status[id]:(TASK[id].status||'');}
function fieldOf(id,k){var f=state.fields[id]||{};if(f[k]!==undefined)return f[k];return k==='goal'?TASK[id].goal:'';}

// ---------- 保存 ----------
var saveTimer=null;
function toast(msg,ms){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(t._h);if(ms)t._h=setTimeout(function(){t.classList.remove('on');},ms);}
function buildDoc(){
  var css=document.getElementById('css').textContent;
  var data=document.getElementById('data').textContent;
  var js=document.getElementById('appjs').textContent;
  var st=JSON.stringify(state).replace(/</g,'\\u003c');
  var SC='</'+'script>';
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="app"></div><script type="application/json" id="data">'+data+SC+'<script type="application/json" id="state">'+st+SC+'<script id="appjs">'+js+SC+'</body></html>';
}
function save(){
  if(mode==='local'){lsSet();toast('保存しました',1200);return;}
  if(readOnly)return;
  toast('保存中…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{sessionStorage.setItem('yarukoto-view',location.hash||'');}catch(e){}
    artifactApi.publish(buildDoc()).then(function(){toast('保存しました',1500);},function(err){
      var c=err&&err.code;
      if(c==='conflict'){toast('別の端末の更新を読み込みます',2000);}
      else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){readOnly=true;toast('この画面は閲覧専用です',2500);render();}
      else if(c==='rate_limited'){toast('保存が混み合っています。少し待ってもう一度',2500);}
      else{toast('保存できませんでした。もう一度操作してください',2500);}
    });
  },1800);
}

// ---------- 予定 ----------
function evActive(e,day){return e.date<=day&&day<=e.end;}
function evRow(e,opt){
  opt=opt||{};
  var done=!!state.done[e.id];
  var w, cls='when';
  if(evActive(e,TODAY)){w=e.end===TODAY?'今日まで':'〆'+md(e.end).replace(/（.）/,'');cls+=' today';}
  else if(e.end<TODAY){w=md(e.end);cls+=' late';}
  else{var n=diff(TODAY,e.date);w=n===1?'明日':md(e.date);}
  var t=TASK[e.task];
  return '<div class="row k-'+e.kind+(done?' done':'')+'"><span class="stripe"></span>'+
    '<button class="chk" data-done="'+e.id+'" aria-pressed="'+done+'" aria-label="'+esc(e.title)+'を完了にする"'+(readOnly?' disabled':'')+'>'+IC.check+'</button>'+
    '<a class="main" href="#t-'+e.task+'" style="color:inherit;text-decoration:none"><div class="t">'+esc(e.title)+'</div><div class="s">旗振り役 '+esc(t.flag)+'・'+esc(t.who)+(e.date!==e.end?'・'+md(e.date)+'〜'+md(e.end):'')+'</div></a>'+
    '<span class="'+cls+'">'+w+'</span></div>';
}
function curZ(){for(var i=0;i<ZPER.length;i++){if(TODAY<=ZPER[i][3])return i;}return ZPER.length-1;}

function viewToday(){
  var ev=DATA.events;
  var from=addDays(TODAY,-14), to=addDays(TODAY,14);
  var late=ev.filter(function(e){return e.end<TODAY&&e.end>=from&&!state.done[e.id]&&e.kind!=='do';});
  var now=ev.filter(function(e){return evActive(e,TODAY);});
  var soon=ev.filter(function(e){return e.date>TODAY&&e.date<=to;});
  var zi=curZ(), zv=state.tracker[zi], zp=ZPER[zi];
  var zpct=Math.min(100,Math.round((+zv||0)*10));
  var h='';
  h+='<div class="kpi" style="margin-top:16px"><div class="'+(late.length?'late':'')+'"><b>'+late.length+'</b><span>やり残し</span></div><div><b>'+now.length+'</b><span>今日</span></div><div><b>'+soon.length+'</b><span>2週間以内</span></div></div>';
  if(late.length){h+='<h2>やり残し <span class="n">終わったらチェック</span></h2><div class="card">'+late.map(evRow).join('')+'</div>';}
  h+='<h2>今日 <span class="n">'+md(TODAY)+'</span></h2><div class="card">'+(now.length?now.map(evRow).join(''):'<div class="empty">今日が期限・期間中の予定はありません</div>')+'</div>';
  h+='<h2>これから2週間</h2><div class="card">'+(soon.length?soon.map(evRow).join(''):'<div class="empty">予定はありません</div>')+'</div>';
  if(TODAY<=ZPER[5][3]){
    h+='<h2>０→１ いまの期 <span class="n">第'+(zi+1)+'期 '+zp[0]+'〜'+zp[1]+'</span></h2><a class="card row" href="#t-zero1" style="display:flex;border-top:1px solid var(--line)"><div class="main"><div class="t">'+(zv==null?'実績 未入力':'実績 '+zv+' / 10件')+'</div><div class="meter"><i style="width:'+zpct+'%"></i></div></div>'+IC.chev+'</a>';
  }
  var visit=DATA.tasks.filter(function(t){return t.cat==='訪問時';});
  h+='<h2>訪問時チェック <span class="n">客先に行くたびに</span></h2><div class="card">'+visit.map(function(t){return '<a class="row" href="#t-'+t.id+'"><div class="main"><div class="t">'+esc(t.name)+'</div><div class="s">'+esc(t.note)+'</div></div>'+IC.chev+'</a>';}).join('')+'</div>';
  return h;
}

function viewList(){
  var h='';
  ['期限あり','定例','訪問時'].forEach(function(cat){
    var ts=DATA.tasks.filter(function(t){return t.cat===cat;});
    h+='<h2>'+cat+' <span class="n">'+ts.length+'件</span></h2><div class="card">';
    ts.forEach(function(t){
      var st=statusOf(t.id);
      var nx=DATA.events.filter(function(e){return e.task===t.id&&e.end>=TODAY;})[0];
      h+='<a class="row" href="#t-'+t.id+'"><div class="main"><div class="t">'+esc(t.name)+'</div><div class="s">'+esc(t.freq)+'・旗振り役 '+esc(t.flag)+(nx?'・次 '+md(nx.date):'')+'</div></div>'+(st?'<span class="pill p-'+st+'">'+st+'</span>':'')+IC.chev+'</a>';
    });
    h+='</div>';
  });
  return h;
}

function viewDetail(id){
  var t=TASK[id]; if(!t)return viewList();
  var st=statusOf(id), dis=readOnly?' disabled':'';
  var h='<a class="back" href="#list">'+IC.back+'一覧へ</a>';
  h+='<div class="dhead"><div class="cat">'+esc(t.cat)+'</div><h2>'+esc(t.name)+'</h2></div>';
  h+='<dl class="facts"><dt>旗振り役</dt><dd>'+esc(t.flag)+'</dd><dt>やる人</dt><dd>'+esc(t.who)+'</dd><dt>頻度／締切</dt><dd>'+esc(t.freq)+'</dd><dt>どこで</dt><dd>'+esc(t.where)+'</dd><dt>貢献先</dt><dd>'+esc(t.contrib)+'</dd>'+(t.note?'<dt>メモ</dt><dd>'+esc(t.note)+'</dd>':'')+'</dl>';
  h+='<label class="f" for="f-status">状況</label><select id="f-status" data-status="'+id+'"'+dis+'><option value="">（なし）</option>'+STATUSES.map(function(s){return '<option'+(s===st?' selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(id==='zero1'){
    var cum=0,ci=curZ();
    h+='<h2>件数トラッカー <span class="n">2週で10件</span></h2><table class="trk"><thead><tr><th>期間</th><th>実績</th><th>累計</th><th>累計目標</th><th>達成率</th></tr></thead><tbody>';
    ZPER.forEach(function(p,i){var v=state.tracker[i];if(v!=null)cum+=+v;var goal=10*(i+1);
      h+='<tr'+(i===ci?' class="cur"':'')+'><td>第'+(i+1)+'期 '+p[0]+'〜'+p[1]+'</td><td><input type="number" min="0" inputmode="numeric" id="trk-'+i+'" data-trk="'+i+'" value="'+(v==null?'':v)+'" aria-label="第'+(i+1)+'期の実績"'+dis+'></td><td>'+(v==null?'':cum)+'</td><td>'+goal+'</td><td>'+(v==null?'':Math.round(cum/goal*100)+'%')+'</td></tr>';});
    h+='</tbody></table>';
  }
  h+='<h2>中身</h2><div class="card" style="padding:4px 12px 12px">';
  [['purpose','目的（なぜやるか）'],['goal','ゴール（何をもって完了か）'],['how','手順・やり方'],['links','関連資料（共有フォルダの場所など）']].forEach(function(f){
    h+='<label class="f" for="fld-'+f[0]+'">'+f[1]+'</label><textarea id="fld-'+f[0]+'" data-fld="'+f[0]+'"'+dis+'>'+esc(fieldOf(id,f[0]))+'</textarea>';});
  h+='<div class="btns"><button class="btn" id="save-fields" data-id="'+id+'"'+dis+'>中身を保存</button></div></div>';
  var ms=state.memos[id]||[];
  h+='<h2>進捗メモ <span class="n">'+ms.length+'件</span></h2><div class="card">'+(ms.length?ms.map(function(m,i){return '<div class="memo">'+(readOnly?'':'<button class="x" data-delmemo="'+i+'" aria-label="このメモを消す">消す</button>')+'<div class="d">'+md(m.d)+'</div><div><b>やったこと</b> '+esc(m.did)+'</div>'+(m.next?'<div><b>次にやること</b> '+esc(m.next)+'</div>':'')+'</div>';}).join(''):'<div class="empty">まだありません</div>')+'</div>';
  if(!readOnly){
    h+='<div class="card" style="padding:4px 12px 12px;margin-top:8px"><div class="grid3"><div><label class="f" for="m-d">日付</label><input type="date" id="m-d" value="'+TODAY+'"></div></div><label class="f" for="m-did">やったこと</label><input type="text" id="m-did"><label class="f" for="m-next">次にやること</label><input type="text" id="m-next"><div class="btns"><button class="btn" id="add-memo" data-id="'+id+'">メモを追加</button></div></div>';
  }
  var evs=DATA.events.filter(function(e){return e.task===id&&e.end>=TODAY;});
  h+='<h2>これからの予定 <span class="n">'+evs.length+'件</span></h2><div class="card">'+(evs.length?evs.map(evRow).join(''):'<div class="empty">カレンダーに載る予定はありません</div>')+'</div>';
  return h;
}

var calMonth=null, calSel=TODAY;
function viewCal(){
  if(!calMonth){var d=parse(TODAY);calMonth=[d.getFullYear(),d.getMonth()];}
  var y=calMonth[0],m=calMonth[1];
  var first=new Date(y,m,1), start=new Date(first); var off=(first.getDay()+6)%7; start.setDate(1-off);
  var minM=[2026,9], maxM=[2027,2];
  var canPrev=(y*12+m)>(minM[0]*12+minM[1]), canNext=(y*12+m)<(maxM[0]*12+maxM[1]);
  var h='<div class="calbar"><button class="iconbtn" id="cal-prev" aria-label="前の月"'+(canPrev?'':' disabled')+'>'+IC.prev+'</button><h2>'+y+'年 '+(m+1)+'月</h2><button class="iconbtn" id="cal-next" aria-label="次の月"'+(canNext?'':' disabled')+'>'+IC.next+'</button></div>';
  h+='<div class="cal">'+['月','火','水','木','金','土','日'].map(function(w,i){return '<div class="wd'+(i===5?' sat':i===6?' sun':'')+'">'+w+'</div>';}).join('');
  var dim=new Date(y,m+1,0).getDate(), cells=Math.ceil((off+dim)/7)*7;
  for(var i=0;i<cells;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);var s=iso(d);
    var evs=DATA.events.filter(function(e){return evActive(e,s);});
    var c='day'+(d.getMonth()!==m?' out':'')+(d.getDay()===0?' sun':d.getDay()===6?' sat':'')+(HOL[s]?' hol':'')+(s===TODAY?' is-today':'')+(s===calSel?' sel':'');
    h+='<button class="'+c+'" data-day="'+s+'" aria-label="'+md(s)+' 予定'+evs.length+'件"><span class="num">'+d.getDate()+'</span>';
    evs.slice(0,3).forEach(function(e){h+='<span class="ev k-'+e.kind+(state.done[e.id]?' isdone':'')+'">'+SHORT[e.task]+'</span>';});
    if(evs.length>3)h+='<span class="more">+'+(evs.length-3)+'</span>';
    h+='</button>';
  }
  h+='</div><div class="legend"><span><i style="background:var(--due)"></i>締切</span><span><i style="background:var(--accent)"></i>期間（月初・第3週）</span><span><i style="background:var(--do)"></i>勉強会</span><span>赤い日付＝土日祝・年末年始</span></div>';
  var list=DATA.events.filter(function(e){return evActive(e,calSel);});
  h+='<h2>'+md(calSel)+' <span class="n">'+list.length+'件</span></h2><div class="card">'+(list.length?list.map(evRow).join(''):'<div class="empty">予定はありません</div>')+'</div>';
  return h;
}

   '<li>当日の朝8:30に通知が来ます。締切の予定は前日9:00にも通知が来ます。</li>'+
  '</ol></div>';
  h+='<p class="note">取り込みは1回だけにしてください。2回取り込むと予定が二重になります。ファイルに入っているのは2026年11月18日以降〜2027年3月末の予定です。</p>';
  h+='<p class="note">Googleカレンダーに取り込んだ場合は、ファイルの通知時刻ではなくGoogleカレンダー側の通知設定が使われます。</p>';
  h+='<h2>このアプリに入っている予定の決め方</h2><div class="card">'+
   [['月初3営業日','CE案件の整理・月初見込み','土日祝と年末年始（12/29〜1/3）を除いて数えています'],['2週目の金曜','最終見込み','その月の2回目の金曜'],['第3週','棚卸・部品の整理','半年スケジュールの◎の週（月〜金）'],['毎週月曜','通信ミドル勉強会','2/15まで。祝日の月曜は入れていません'],['2週ごと','０→１ 期の締め','各期の最終日（金曜）'],['締切','消滅10/30・通信ミドル2/26・8950点検3/31','']].map(function(r){return '<div class="row"><div class="main"><div class="t">'+r[0]+'：'+r[1]+'</div>'+(r[2]?'<div class="s">'+r[2]+'</div>':'')+'</div></div>';}).join('')+'</div>';
  h+='<p class="note">医療機器テストと訪問時の3つは日付が決まっていないので、カレンダーには入れていません。</p>';
  return h;
}

// ---------- 画面 ----------
function route(){var h=(location.hash||'').slice(1);if(h.indexOf('t-')===0)return {v:'detail',id:h.slice(2)};if(['list','cal','notify'].indexOf(h)>=0)return {v:h};return {v:'today'};}
function render(){
  var r=route(), body;
  if(r.v==='detail')body=viewDetail(r.id);else if(r.v==='list')body=viewList();else if(r.v==='cal')body=viewCal();else if(r.v==='notify')body=viewNotify();else body=viewToday();
  var tab=r.v==='detail'?'list':r.v;
  var d=parse(TODAY);
  var tabs=[['today','きょう',IC.today],['list','一覧',IC.list],['cal','カレンダー',IC.cal],['notify','通知',IC.bell]];
  document.getElementById('app').innerHTML=
    '<header class="top"><div class="in"><h1>やること</h1><span class="date">'+d.getFullYear()+'年'+md(TODAY)+'</span></div></header>'+
    '<main class="wrap"><div class="ro'+(readOnly?' on':'')+'">閲覧専用で開いています。チェックやメモは保存されません。</div>'+body+'</main>'+
    '<nav class="tabs" aria-label="画面切り替え"><div class="in">'+tabs.map(function(t){return '<a href="#'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[2]+t[1]+'</a>';}).join('')+'</div></nav><div class="toast" id="toast" role="status"></div>';
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-done],[data-day],#cal-prev,#cal-next,#save-fields,#add-memo,[data-delmemo]');
  if(!el||readOnly&&!el.matches('[data-day],#cal-prev,#cal-next'))return;
  if(el.dataset.done){var id=el.dataset.done;if(state.done[id])delete state.done[id];else state.done[id]=true;render();save();return;}
  if(el.dataset.day){calSel=el.dataset.day;var d=parse(calSel);calMonth=[d.getFullYear(),d.getMonth()];render();return;}
  if(el.id==='cal-prev'||el.id==='cal-next'){var k=calMonth[0]*12+calMonth[1]+(el.id==='cal-next'?1:-1);calMonth=[Math.floor(k/12),k%12];render();return;}
  var tid=route().id;
  if(el.id==='save-fields'){var f=state.fields[tid]=state.fields[tid]||{};document.querySelectorAll('[data-fld]').forEach(function(t){f[t.dataset.fld]=t.value;});save();return;}
  if(el.id==='add-memo'){var did=document.getElementById('m-did').value.trim();if(!did){toast('「やったこと」を入れてください',1800);return;}
    var a=state.memos[tid]=state.memos[tid]||[];a.push({d:document.getElementById('m-d').value||TODAY,did:did,next:document.getElementById('m-next').value.trim()});a.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0;});render();save();return;}
  if(el.dataset.delmemo!=null){state.memos[tid].splice(+el.dataset.delmemo,1);render();save();return;}
});
document.addEventListener('change',function(ev){
  var el=ev.target;if(readOnly)return;
  if(el.dataset.status){state.status[el.dataset.status]=el.value;save();return;}
  if(el.dataset.trk!=null){var v=el.value===''?null:Math.max(0,parseInt(el.value,10)||0);state.tracker[+el.dataset.trk]=v;render();save();}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
try{var v=sessionStorage.getItem('yarukoto-view');if(v!=null){sessionStorage.removeItem('yarukoto-view');if(!location.hash&&v)location.hash=v;}}catch(e){}
var saved=lsGet(); if(saved&&!Object.keys(state.done).length&&!Object.keys(state.memos).length){/* 単体HTMLで使う場合は端末内の保存を優先 */ state=saved;['status','fields','memos','done'].forEach(function(k){if(!state[k])state[k]={};});if(!state.tracker)state.tracker=[null,null,null,null,null,null];}
render();
// 電波がなくても起動できるように（GitHub Pagesに置いたときだけ）
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}}catch(e){}
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){if(a){artifactApi=a;mode='artifact';state=JSON.parse(document.getElementById('state').textContent||'{}');['status','fields','memos','done'].forEach(function(k){if(!state[k])state[k]={};});if(!state.tracker)state.tracker=[null,null,null,null,null,null];render();}},function(){});}
})();
